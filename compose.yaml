name: wow-forever-profession-companion
services:
  db:
    image: postgres:18.7
    environment:
      POSTGRES_DB: wowcompanion
      POSTGRES_USER: wowcompanion
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wowcompanion -d wowcompanion"]
      interval: 5s
      timeout: 3s
      retries: 12
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8081
      MANAGEMENT_SERVER_ADDRESS: 127.0.0.1
      MANAGEMENT_SERVER_PORT: 8082
      DB_URL: jdbc:postgresql://db:5432/wowcompanion
      DB_USER: wowcompanion
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      LOG_FILE: /app/logs/profession-companion.log
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      LOG_MAX_FILE_SIZE: ${LOG_MAX_FILE_SIZE:-10MB}
      LOG_MAX_HISTORY: ${LOG_MAX_HISTORY:-7}
      LOG_TOTAL_SIZE_CAP: ${LOG_TOTAL_SIZE_CAP:-80MB}
    ports:
      - "127.0.0.1:${APP_PORT:-8083}:8081"
    volumes:
      - application-logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
volumes:
  postgres-data:
  application-logs:
