name: wow-forever-profession-companion
services:
  db:
    image: postgres:18.7
    environment:
      POSTGRES_DB: wowcompanion
      POSTGRES_USER: wowcompanion
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wowcompanion -d wowcompanion"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  postgres-data:
