spring:
  application:
    name: wow-forever-profession-companion
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5433/wowcompanion}
    username: ${DB_USER:wowcompanion}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8081}
