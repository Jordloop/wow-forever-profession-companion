spring:
  application:
    name: wow-forever-profession-companion
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5433/wowcompanion}
    username: ${DB_USER:wowcompanion}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8081}
logging:
  file:
    name: ${LOG_FILE:logs/profession-companion.log}
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [cid:%X{correlationId:-}] %logger{36} - %msg%n'
  structured:
    format:
      file: logstash
  level:
    com.wowcompanion: ${APP_LOG_LEVEL:INFO}
  logback:
    rollingpolicy:
      max-file-size: ${LOG_MAX_FILE_SIZE:10MB}
      max-history: ${LOG_MAX_HISTORY:7}
      total-size-cap: ${LOG_TOTAL_SIZE_CAP:80MB}
management:
  server:
    address: ${MANAGEMENT_SERVER_ADDRESS:127.0.0.1}
    port: ${MANAGEMENT_SERVER_PORT:8082}
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    build:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
info:
  app:
    name: WoW Forever Profession Companion
