services:
  db:
    image: postgres:18.7
    environment:
      POSTGRES_DB: security_test
      POSTGRES_USER: security_test
      POSTGRES_PASSWORD: browser-test-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U security_test -d security_test"]
      interval: 5s
      timeout: 3s
      retries: 12
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod,browser-test
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8081
      MANAGEMENT_SERVER_ADDRESS: 127.0.0.1
      MANAGEMENT_SERVER_PORT: 8082
      DB_URL: jdbc:postgresql://db:5432/security_test
      DB_USER: security_test
      DB_PASSWORD: browser-test-only
      APP_SECURITY_DEVELOPMENT_PROXY_ORIGINS: http://127.0.0.1:4321
      LOG_FILE: /app/logs/security-test.log
      APP_LOG_LEVEL: ERROR
    ports:
      - "127.0.0.1:4320:8081"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8082/actuator/health",
        ]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 60s
